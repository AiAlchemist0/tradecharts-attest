<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-label="Who TradeCharts is for: wallet-native traders, charting beginners, experienced chartists">
  <rect width="1100" height="500" rx="16" fill="#080809"/>
  <rect x="0.75" y="0.75" width="1098.5" height="498.5" rx="15.25" fill="none" stroke="#2a2a2e"/>
  <text x="40" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3.2" fill="#c4a06a">WHO THIS IS FOR</text>
  <text x="40" y="76" font-family="Georgia, 'Iowan Old Style', Times New Roman, serif" font-size="26" fill="#ecece8">Three people. One desk.</text>
  <text x="40" y="104" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="14" fill="#8b8b86">About 774 million people owned crypto by mid-2026 (Crypto.com). Most only hold. We design for the smaller set who trade — or who are learning to read a chart.</text>
  <text x="40" y="126" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5c58">Mix below is how we weight the product — not a survey of 774 million owners.</text>

  <!-- three cards -->
  <g>
    <rect x="40" y="152" width="520" height="96" rx="12" fill="#111114" stroke="#8fa3b8" stroke-opacity="0.5"/>
    <text x="64" y="188" font-family="Georgia, Times New Roman, serif" font-size="36" fill="#8fa3b8">50%</text>
    <text x="160" y="178" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#ecece8">Wallet-native traders</text>
    <text x="160" y="202" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b8b86">Already in the book — spot and perps. The bag is the watchlist.</text>
    <text x="160" y="222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b8b86">They need the map next to coins they actually hold.</text>
  </g>
  <g>
    <rect x="40" y="260" width="520" height="96" rx="12" fill="#111114" stroke="#3dbe8c" stroke-opacity="0.5"/>
    <text x="64" y="296" font-family="Georgia, Times New Roman, serif" font-size="36" fill="#3dbe8c">30%</text>
    <text x="160" y="286" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#ecece8">Charting beginners</text>
    <text x="160" y="310" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b8b86">They can trade, but the 1–5 still looks like a foreign language.</text>
    <text x="160" y="330" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b8b86">Ask AI teaches the story. They Confirm only when they understand it.</text>
  </g>
  <g>
    <rect x="40" y="368" width="520" height="96" rx="12" fill="#111114" stroke="#c4a06a" stroke-opacity="0.5"/>
    <text x="64" y="404" font-family="Georgia, Times New Roman, serif" font-size="36" fill="#c4a06a">20%</text>
    <text x="160" y="394" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#ecece8">Experienced chartists</text>
    <text x="160" y="418" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b8b86">They already mark structure. Stocks or crypto. Empty tape first.</text>
    <text x="160" y="438" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b8b86">The validator refuses a broken count. They Confirm. Their correction wins.</text>
  </g>

  <!-- donut 50 / 30 / 20 of circumference 2π×108 ≈ 678.6 -->
  <g transform="translate(820,310)">
    <circle r="108" fill="none" stroke="#1a1a1e" stroke-width="40"/>
    <!-- 50% wallet steel -->
    <circle r="108" fill="none" stroke="#8fa3b8" stroke-width="40" stroke-dasharray="339 340" stroke-dashoffset="0" transform="rotate(-90)"/>
    <!-- 30% beginner green -->
    <circle r="108" fill="none" stroke="#3dbe8c" stroke-width="40" stroke-dasharray="204 475" stroke-dashoffset="-339" transform="rotate(-90)"/>
    <!-- 20% chartist gold -->
    <circle r="108" fill="none" stroke="#c4a06a" stroke-width="40" stroke-dasharray="136 543" stroke-dashoffset="-543" transform="rotate(-90)"/>
    <text text-anchor="middle" y="-4" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#ecece8">Intended mix</text>
    <text text-anchor="middle" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">how we weight the desk</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
    <rect x="700" y="448" width="10" height="10" rx="2" fill="#8fa3b8"/>
    <text x="716" y="458" fill="#8b8b86">50% wallet</text>
    <rect x="820" y="448" width="10" height="10" rx="2" fill="#3dbe8c"/>
    <text x="836" y="458" fill="#8b8b86">30% beginner</text>
    <rect x="950" y="448" width="10" height="10" rx="2" fill="#c4a06a"/>
    <text x="966" y="458" fill="#8b8b86">20% chartist</text>
  </g>
</svg>
