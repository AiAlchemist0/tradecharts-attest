<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-label="Compose joins the standardized bag with confirmed maps">
  <rect width="1100" height="440" rx="16" fill="#080809"/>
  <rect x="0.75" y="0.75" width="1098.5" height="438.5" rx="15.25" fill="none" stroke="#2a2a2e"/>
  <text x="40" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3.2" fill="#c4a06a">SEE · THE GRAPH</text>
  <text x="40" y="78" font-family="Georgia, 'Iowan Old Style', Times New Roman, serif" font-size="28" fill="#ecece8">Bag ⋈ map</text>
  <text x="40" y="106" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="14" fill="#8b8b86">Two live Graph products. The join is the decision — not a second homemade schema.</text>

  <!-- bag -->
  <rect x="40" y="136" width="250" height="248" rx="12" fill="#111114" stroke="#2a2a2e"/>
  <text x="165" y="168" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2.2" fill="#c4a06a">STANDARDIZED BAG</text>
  <text x="64" y="208" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#ecece8">ETH</text>
  <text x="250" y="208" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#8b8b86">spot</text>
  <text x="64" y="240" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#ecece8">PENDLE</text>
  <text x="250" y="240" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#8b8b86">spot</text>
  <text x="64" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#ecece8">ETH perp</text>
  <text x="250" y="272" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#8b8b86">long</text>
  <text x="64" y="304" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5c5c58">CLAIM…</text>
  <text x="250" y="304" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#5c5c58">dropped</text>
  <text x="64" y="348" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">Hostile metadata never joins.</text>

  <!-- maps -->
  <rect x="330" y="136" width="250" height="248" rx="12" fill="#111114" stroke="#2a2a2e"/>
  <text x="455" y="168" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2.2" fill="#c4a06a">MAPS SUBGRAPH</text>
  <text x="354" y="208" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#ecece8">ETH-USD</text>
  <text x="540" y="208" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#d45b4a">short</text>
  <text x="354" y="240" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8b8b86">kill 4100</text>
  <text x="354" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5c5c58">PENDLE</text>
  <text x="540" y="272" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#5c5c58">none</text>
  <text x="354" y="348" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">Confirm is hashed. Not a tweet.</text>

  <!-- join glyph -->
  <circle cx="640" cy="260" r="36" fill="#111114" stroke="#c4a06a" stroke-width="1.6"/>
  <text x="640" y="268" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#c4a06a">⋈</text>
  <text x="640" y="318" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#c4a06a">compose</text>

  <line x1="290" y1="260" x2="330" y2="260" stroke="#5c5c58"/>
  <line x1="580" y1="260" x2="604" y2="260" stroke="#5c5c58"/>
  <line x1="676" y1="260" x2="710" y2="260" stroke="#c4a06a" stroke-width="1.3"/>

  <!-- statuses -->
  <g>
    <rect x="710" y="136" width="350" height="52" rx="10" fill="#111114" stroke="#3dbe8c" stroke-opacity="0.45"/>
    <text x="732" y="168" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#3dbe8c">aligned</text>
    <text x="1036" y="168" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b8b86">net matches the map</text>
  </g>
  <g>
    <rect x="710" y="200" width="350" height="52" rx="10" fill="#111114" stroke="#d45b4a" stroke-opacity="0.5"/>
    <text x="732" y="232" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#d45b4a">fighting</text>
    <text x="1036" y="232" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b8b86">long vs confirmed Short</text>
  </g>
  <g>
    <rect x="710" y="264" width="350" height="52" rx="10" fill="#111114" stroke="#2a2a2e"/>
    <text x="732" y="296" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#8b8b86">unmapped</text>
    <text x="1036" y="296" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b8b86">bag, no Confirm</text>
  </g>
  <g>
    <rect x="710" y="328" width="350" height="52" rx="10" fill="#111114" stroke="#c4a06a" stroke-opacity="0.45"/>
    <text x="732" y="360" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#c4a06a">insolvent</text>
    <text x="1036" y="360" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b8b86">liq inside the map</text>
  </g>
</svg>
