<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-label="See. Propose. Teach. Confirm. AI drafts the weekly map. You Confirm.">
  <rect width="1100" height="420" rx="16" fill="#080809"/>
  <rect x="0.75" y="0.75" width="1098.5" height="418.5" rx="15.25" fill="none" stroke="#2a2a2e"/>
  <text x="40" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3.2" fill="#c4a06a">HOW YOU WORK</text>
  <text x="40" y="78" font-family="Georgia, 'Iowan Old Style', Times New Roman, serif" font-size="26" fill="#ecece8">See. Propose. Teach. Confirm.</text>
  <text x="40" y="106" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="13" fill="#8b8b86">AI drafts a map and teaches why. You Confirm. Not a signal. Not financial advice.</text>

  <g>
    <rect x="40" y="136" width="240" height="200" rx="14" fill="#111114" stroke="#2a2a2e"/>
    <text x="160" y="168" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#c4a06a">01 · SEE</text>
    <polyline fill="none" stroke="#f0ebe3" stroke-width="2.2" stroke-linejoin="round" points="72,268 108,240 140,252 176,200 208,228 252,188"/>
    <text x="160" y="310" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b8b86">The candles are what happened.</text>
  </g>
  <g>
    <rect x="300" y="136" width="240" height="200" rx="14" fill="#111114" stroke="#3dbe8c" stroke-opacity="0.4"/>
    <text x="420" y="168" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#3dbe8c">02 · PROPOSE</text>
    <text x="420" y="230" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#ecece8">Propose</text>
    <text x="420" y="258" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b8b86">Weekly 1–5 or ABC · Long and Short</text>
    <text x="420" y="310" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b8b86">A rules check can refuse it.</text>
  </g>
  <g>
    <rect x="560" y="136" width="240" height="200" rx="14" fill="#111114" stroke="#c4a06a" stroke-opacity="0.45"/>
    <text x="680" y="168" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#c4a06a">03 · TEACH</text>
    <text x="680" y="230" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#ecece8">Ask AI</text>
    <text x="680" y="258" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b8b86">Why this stop. Why the tape faked out.</text>
    <text x="680" y="310" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b8b86">You learn the language.</text>
  </g>
  <g>
    <rect x="820" y="136" width="240" height="200" rx="14" fill="#111114" stroke="#8fa3b8" stroke-opacity="0.45"/>
    <text x="940" y="168" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#8fa3b8">04 · CONFIRM</text>
    <text x="940" y="230" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#ecece8">Confirm</text>
    <text x="940" y="258" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b8b86">A map you can explain.</text>
    <text x="940" y="310" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b8b86">You still own the risk.</text>
  </g>

  <text x="40" y="380" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b8b86">This is not a course. Ask AI walks the count until you can Confirm — or interrogate the draft if you already can.</text>
</svg>
