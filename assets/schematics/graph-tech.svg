  </g>

  <text x="40" y="128" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2.2" fill="#8b8b86">01 &#183; BASE &#183; EVENTS THE GRAPH CAN INDEX</text>
  <rect x="40" y="140" width="500" height="118" rx="12" fill="#111114" stroke="#3dbe8c" stroke-opacity="0.35"/>
  <text x="60" y="168" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.8" fill="#3dbe8c">ERC-20 TRANSFER</text>
  <text x="60" y="196" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#ecece8">Coins on Base</text>
  <text x="60" y="222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#c8c8c2">Allowlisted balances &#8594; trade-charts-bag</text>
  <text x="60" y="242" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">WETH &#183; USDC &#183; cbBTC &#183; DEGEN &#183; VIRTUAL &#183; DAI</text>

  <rect x="560" y="140" width="500" height="118" rx="12" fill="#111114" stroke="#c4a06a" stroke-opacity="0.5"/>
  <text x="580" y="168" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.8" fill="#c4a06a">MAPCONFIRMED</text>
  <text x="580" y="196" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#ecece8">confirm(wallet, symbol, side)</text>
  <text x="580" y="222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#c8c8c2">0x78D7&#8230;3C7C &#183; Studio trade-charts v0.4.0</text>
  <text x="580" y="242" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">Hashed Confirm. Not a tweet, not a Pine alert.</text>

  <line x1="290" y1="258" x2="290" y2="292" stroke="#5c5c58" marker-end="url(#t-arr)"/>
  <line x1="810" y1="258" x2="810" y2="292" stroke="#5c5c58" marker-end="url(#t-arr)"/>
  <text x="550" y="286" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.6" fill="#8b8b86">STUDIO INDEXES &#183; KEYLESS HTTP</text>

  <text x="40" y="318" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2.2" fill="#8b8b86">02 &#183; TWO GRAPH PRODUCTS &#183; NO FEDERATED QUERY</text>
  <rect x="40" y="330" width="500" height="132" rx="12" fill="#111114" stroke="#2a2a2e"/>
  <text x="60" y="358" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.8" fill="#3dbe8c">PRODUCT A &#183; BAG</text>
  <text x="60" y="386" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#ecece8">trade-charts-bag</text>
  <text x="60" y="412" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#c8c8c2">GET Studio &#183; balances(wallet)</text>
  <text x="60" y="434" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#8b8b86">query/1758683/trade-charts-bag/version/latest</text>
  <text x="60" y="452" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">Demo + MCP read this. Desk Ask uses RPC + HL instead.</text>

  <rect x="560" y="330" width="500" height="132" rx="12" fill="#111114" stroke="#2a2a2e"/>
  <text x="580" y="358" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.8" fill="#c4a06a">PRODUCT B &#183; MAPS</text>
  <text x="580" y="386" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#ecece8">trade-charts</text>
  <text x="580" y="412" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#c8c8c2">GET Studio &#183; maps(wallet) &#183; block N</text>
  <text x="580" y="434" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#8b8b86">query/1758683/trade-charts/version/latest</text>
  <text x="580" y="452" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">Desk board + Ask re-fetch this turn. Same maps as demo.</text>

  <line x1="290" y1="462" x2="290" y2="498" stroke="#5c5c58"/>
  <line x1="810" y1="462" x2="810" y2="498" stroke="#5c5c58"/>
  <line x1="290" y1="498" x2="810" y2="498" stroke="#5c5c58"/>
  <line x1="550" y1="498" x2="550" y2="522" stroke="#c4a06a" marker-end="url(#t-gold)"/>

  <text x="40" y="548" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2.2" fill="#8b8b86">03 &#183; COMPOSE.TS &#183; APPLICATION SIDE</text>
  <rect x="40" y="560" width="1020" height="148" rx="12" fill="#111114" stroke="#c4a06a" stroke-opacity="0.45"/>
  <circle cx="88" cy="634" r="22" fill="#080809" stroke="#c4a06a" stroke-width="1.6"/>
  <text x="88" y="641" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#c4a06a">&#8904;</text>
  <text x="128" y="588" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#c4a06a">CONFLICTOF(ROW)</text>
  <text x="128" y="616" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#ecece8">net = spot + signed perp &#183; bias = confirmed side &#183; liq = venue liquidation &#183; kill = weekly close on the map</text>
  <text x="128" y="640" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#c8c8c2">no Confirm &#8594; unmapped &#183; liq inside a still-valid map &#8594; insolvent &#183; net against a one-sided bias &#8594; fighting &#183; else aligned</text>
  <text x="128" y="664" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">src/graph/compose.ts + src/policy/conflict.ts &#183; four strings only &#183; Studio fail &#8594; payload says fail &#183; model must not guess</text>
  <text x="128" y="688" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">Cite: ETH aligned &#183; confirmed long &#183; spot 0.003323 &#183; Graph maps block N</text>

  <line x1="550" y1="708" x2="550" y2="732" stroke="#c4a06a" marker-end="url(#t-gold)"/>

  <text x="40" y="758" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2.2" fill="#8b8b86">04 &#183; FOUR STATES &#183; THE ONLY VOCABULARY</text>
  <rect x="40" y="770" width="242" height="52" rx="10" fill="#111114" stroke="#3dbe8c" stroke-opacity="0.45"/>
  <text x="56" y="802" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#3dbe8c">aligned</text>
  <text x="262" y="802" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">net matches</text>
  <rect x="294" y="770" width="242" height="52" rx="10" fill="#111114" stroke="#d45b4a" stroke-opacity="0.5"/>
  <text x="310" y="802" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#d45b4a">fighting</text>
  <text x="516" y="802" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">long vs Short</text>
  <rect x="548" y="770" width="242" height="52" rx="10" fill="#111114" stroke="#2a2a2e"/>
  <text x="564" y="802" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#8b8b86">unmapped</text>
  <text x="770" y="802" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">no onchain map</text>
  <rect x="802" y="770" width="258" height="52" rx="10" fill="#111114" stroke="#c4a06a" stroke-opacity="0.45"/>
  <text x="818" y="802" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#c4a06a">insolvent</text>
  <text x="1040" y="802" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">liq inside map</text>

  <line x1="550" y1="822" x2="550" y2="846" stroke="#5c5c58" marker-end="url(#t-arr)"/>

  <text x="40" y="872" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2.2" fill="#8b8b86">05 &#183; SAME FUNCTION &#183; FOUR SURFACES</text>
  <rect x="40" y="884" width="242" height="100" rx="12" fill="#111114" stroke="#2a2a2e"/>
  <text x="56" y="910" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#ecece8">DESK BOARD</text>
  <text x="56" y="934" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#c8c8c2">Wallet panel</text>
  <text x="56" y="954" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">RPC coins + HL perps</text>
  <text x="56" y="972" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">&#8904; Studio maps</text>

  <rect x="294" y="884" width="242" height="100" rx="12" fill="#111114" stroke="#2a2a2e"/>
  <text x="310" y="910" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#ecece8">ASK AI</text>
  <text x="310" y="934" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#c8c8c2">Must cite the row</text>
  <text x="310" y="954" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">Re-fetch this turn</text>
  <text x="310" y="972" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">Maps-live on the desk</text>

  <rect x="548" y="884" width="242" height="100" rx="12" fill="#111114" stroke="#2a2a2e"/>
  <text x="564" y="910" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#ecece8">DEMO</text>
  <text x="564" y="934" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#c8c8c2">Paste any 0x</text>
  <text x="564" y="954" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">Graph bag &#8904; Graph maps</text>
  <text x="564" y="972" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">No keys &#183; bag-live</text>

  <rect x="802" y="884" width="258" height="100" rx="12" fill="#111114" stroke="#2a2a2e"/>
  <text x="818" y="910" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#ecece8">MCP &#183; CLI</text>
  <text x="818" y="934" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#c8c8c2">compose_wallet</text>
  <text x="818" y="954" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">npm run compose -- 0x&#8230;</text>
  <text x="818" y="972" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">Same conflictOf</text>

  <text x="40" y="1016" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">Confirm on the live desk is still a private save. Flatten is not live. Interpretive map &#8212; not a trade recommendation. Paste your own 0x.</text>
