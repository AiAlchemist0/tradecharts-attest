<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1040" viewBox="0 0 1100 1040" role="img" aria-label="Technical map: Base events, two Studio subgraphs, two HTTP queries, then conflictOf. No single GraphQL join.">
  <defs>
    <marker id="t-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5c5c58"/>
    </marker>
    <marker id="t-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c4a06a"/>
    </marker>
  </defs>
  <rect width="1100" height="1040" rx="16" fill="#080809"/>
  <rect x="0.75" y="0.75" width="1098.5" height="1038.5" rx="15.25" fill="none" stroke="#2a2a2e"/>

  <text x="40" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3.2" fill="#c4a06a">THE GRAPH &#183; COMPOSE PIPELINE</text>
  <text x="40" y="70" font-family="Georgia, 'Iowan Old Style', Times New Roman, serif" font-size="26" fill="#ecece8">Two products. Two queries. One status function.</text>
  <text x="40" y="94" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="13" fill="#8b8b86">Application-side join &#8212; not one GraphQL schema. Status is conflictOf only. The model does not invent it.</text>

