<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-label="See, Stand behind, Stop — Graph, Chainlink, Ledger">
  <rect width="1100" height="400" rx="16" fill="#080809"/>
  <rect x="0.75" y="0.75" width="1098.5" height="398.5" rx="15.25" fill="none" stroke="#2a2a2e"/>
  <text x="40" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3.2" fill="#c4a06a">THIS EVENT</text>
  <text x="40" y="78" font-family="Georgia, 'Iowan Old Style', Times New Roman, serif" font-size="28" fill="#ecece8">See · Stand behind · Stop</text>
  <text x="40" y="106" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="14" fill="#8b8b86">The map is the stop. Flatten only. A close, not a wick.</text>

  <g>
    <rect x="40" y="136" width="320" height="212" rx="14" fill="#111114" stroke="#3dbe8c" stroke-opacity="0.4"/>
    <text x="64" y="172" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#3dbe8c">01</text>
    <text x="64" y="210" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#ecece8">See</text>
    <text x="64" y="244" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8b8b86">Wallet is the watchlist.</text>
    <text x="64" y="268" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8b8b86">Aligned / fighting / unmapped.</text>
    <text x="64" y="316" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#c4a06a">THE GRAPH</text>
  </g>
  <g>
    <rect x="390" y="136" width="320" height="212" rx="14" fill="#111114" stroke="#c4a06a" stroke-opacity="0.45"/>
    <text x="414" y="172" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#c4a06a">02</text>
    <text x="414" y="210" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#ecece8">Stand behind</text>
    <text x="414" y="244" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8b8b86">Confirm is hashed. Positioned</text>
    <text x="414" y="268" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8b8b86">or opinion. Kill is a weekly close.</text>
    <text x="414" y="316" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#c4a06a">CHAINLINK</text>
  </g>
  <g>
    <rect x="740" y="136" width="320" height="212" rx="14" fill="#111114" stroke="#8fa3b8" stroke-opacity="0.45"/>
    <text x="764" y="172" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#8fa3b8">03</text>
    <text x="764" y="210" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#ecece8">Stop</text>
    <text x="764" y="244" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8b8b86">Flatten matching risk only.</text>
    <text x="764" y="268" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8b8b86">Device confirms before funds.</text>
    <text x="764" y="316" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#c4a06a">LEDGER</text>
  </g>
</svg>
