  <text x="60" y="186" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#ecece8">Prompt</text>
  <text x="60" y="218" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#c8c8c2">&#8220;Is my bag fighting this map?&#8221;</text>
  <text x="60" y="242" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#c8c8c2">&#8220;Tell me about my position.&#8221;</text>
  <text x="60" y="266" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">A book question &#8212; not a sixth Elliott step.</text>

