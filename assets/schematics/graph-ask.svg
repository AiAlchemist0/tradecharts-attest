  <text x="680" y="186" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#ecece8">Cites the join</text>
  <text x="680" y="218" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#c8c8c2">Re-fetches Studio this turn.</text>
  <text x="680" y="242" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#c8c8c2">Answers in your words.</text>
  <text x="680" y="266" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b8b86">Does not invent status if Studio fails.</text>

