"""Onchain MapConfirmed event on Base. One row per confirm. Compose (aligned / fighting) is not in this subgraph."""
type Map @entity(immutable: false) {
  id: ID!
  wallet: Bytes!
  symbol: String!
  timeframe: String!
  side: String!
  longKill: BigDecimal
  shortKill: BigDecimal
  barTime: BigInt!
  mapHash: Bytes!
  positioned: Boolean!
  txHash: Bytes!
  createdAt: BigInt!
}
