specVersion: 1.2.0
schema:
  file: ./schema.graphql
description: TradeCharts maps subgraph. Confirmed maps are MapConfirmed events on Base. Compose (bag ⋈ maps) runs client-side in src/graph.
dataSources:
  - kind: ethereum
    name: MapConfirmed
    network: base
    source:
      address: "0x78D7F79e50d2fd8cC065A01f15A6d21d0F6d3C7C"
      abi: MapConfirmed
      startBlock: 51160101
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Map
      abis:
        - name: MapConfirmed
          file: ./abis/MapConfirmed.json
      eventHandlers:
        - event: Confirmed(indexed address,string,string,string,string,string,uint256,bytes32,bool)
          handler: handleConfirmed
      file: ./src/mapping.ts
