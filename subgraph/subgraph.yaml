specVersion: 1.2.0
schema:
  file: ./schema.graphql
description: TradeCharts maps subgraph. Confirmed maps are MapConfirmed events on Base Sepolia; compose (bag ⋈ maps) runs client-side in src/graph.
dataSources:
  - kind: ethereum
    name: MapConfirmed
    network: base-sepolia
    source:
      address: "0x17D8ac32E08969C7C0CC3f9e2B39137d208512bE"
      abi: MapConfirmed
      startBlock: 46519840
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Map
      abis:
        - name: MapConfirmed
          file: ./abis/MapConfirmed.json
      eventHandlers:
        - event: Confirmed(indexed address,string,string,string,string,string,uint256,bytes32,bool)
          handler: handleConfirmed
      file: ./src/mapping.ts
