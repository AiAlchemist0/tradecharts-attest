specVersion: 1.2.0
schema:
  file: ./schema.graphql
description: TradeCharts maps subgraph. Confirmed maps are EAS attestations on Base Sepolia; compose (bag ⋈ maps) runs client-side in src/graph.
dataSources:
  - kind: ethereum
    name: EAS
    network: base-sepolia
    source:
      address: "0x4200000000000000000000000000000000000021"
      abi: EAS
      startBlock: 46392400
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Map
      abis:
        - name: EAS
          file: ./abis/EAS.json
      eventHandlers:
        - event: Attested(indexed address,indexed address,bytes32,indexed bytes32)
          handler: handleAttested
        - event: Revoked(indexed bytes32)
          handler: handleRevoked
      file: ./src/mapping.ts
