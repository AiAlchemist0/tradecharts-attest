"""Token metadata (attacker-controlled fields never enter compose rows unchecked — see src/safety/token.ts). Mutable so the handler can load() it — graph-node refuses store lookups on immutable entities."""
type Token @entity(immutable: false) {
  id: ID!
  symbol: String!
  name: String
  decimals: Int!
}

"""A wallet that has transferred an allowlisted token."""
type Account @entity(immutable: false) {
  id: ID!
  balances: [Balance!]! @derivedFrom(field: "account")
}

"""Spot ERC-20 balance per wallet x token from Transfer events in the indexed window (~2 weeks). Not a perp. Not compose status."""
type Balance @entity(immutable: false) {
  id: ID! # {account}|{token}
  account: Account!
  token: Token!
  balance: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
}
