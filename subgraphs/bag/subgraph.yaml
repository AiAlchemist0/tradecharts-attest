specVersion: 1.2.0
schema:
  file: ./schema.graphql
description: TradeCharts bag subgraph. ERC-20 balances for a Base allowlist (WETH, USDC, cbBTC, DEGEN, VIRTUAL, DAI) from Transfer events in the indexed window. The bag side of the compose join (bag ⋈ maps); maps live in subgraph/.
dataSources:
  - kind: ethereum
    name: WETH
    network: base
    source:
      address: "0x4200000000000000000000000000000000000006"
      abi: ERC20
      startBlock: 47100000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Account
        - Balance
        - Token
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleWETH
      file: ./src/mapping.ts
