# Copy to secrets.yaml for local simulate runs. NEVER commit secrets.yaml.
# Maps the workflow's secret IDs to environment variables in the root .env —
# the Vault DON releases these straight into the attested enclave; kill policy
# only ever exists inside the TEE.
secretsNames:
  MAP_SIDE:
    - MAP_SIDE
  KILL:
    - KILL
  NET:
    - NET
